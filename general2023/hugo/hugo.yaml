# baseURL: 'https://hambook.org/tech2022'
languageCode: 'en-us'
title: 'General HamBook'

relativeURLs: false
canonifyURLs: false

module:
  imports:
    - path: hambook.org/hambook/common

params:
  keywords: "Amateur Radio, Ham Radio, General Class, Hambook, Study Manual"
  description: "Prepare for the 2023–2027 US General Class amateur radio exam. Learn about circuits, signals, antennas, propagation, safe station setup, operating procedures, and FCC rules."
  printStylesheet: "css/print.css"
  BookPortableLinks: true
  BookSubtitle: (2023 - 2027)
  BookLogo: "general2023.jpg"
  hsBaseURL: "https://hamstudy.org/flashcard/E3_2023?bk=hambook-general2023&def=q:"
  qrBaseURL: "https://hamstudy.org/api/v1/qrcode"
  figurePath: "figures/%s"
  figureDescriptions:
    g7-1: >-
      Figure G7-1 is a schematic with eleven numbered components. Wires join the symbols into a
      circuit, with a positive DC supply connection at the top, an output at the right, and
      repeated ground symbols marking a common connection. Number 1 is a field-effect
      transistor, with a gate arrow pointing toward its channel. Number 2 is an NPN transistor,
      with an emitter arrow pointing outward. Number 3 is an ordinary diode, with a straight
      cathode bar. Number 4 is a varactor diode, with an added capacitor-like pair of plates.
      Number 5 is a Zener diode, whose cathode bar has bent ends. Number 6 is a transformer with
      two coil windings and lines between them indicating a solid core. Number 7 is an inductor
      with a tap connected partway along its coil. Numbers 8 and 10 are capacitors, each drawn
      with one straight plate and one curved plate. Number 9 is a fixed resistor, drawn as a
      zigzag. Number 11 is a potentiometer, drawn as a resistor with an arrow contacting it to
      represent an adjustable connection.
  linktrim: ""

markup:
  tableOfContents:
    endLevel: 5
    ordered: false
    startLevel: 2

  goldmark:
    renderer:
      unsafe: true
      xHTML: true
      hardWraps: false
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
      autoHeadingID: true

    extensions:
      definitionList: true
      footnote: true
      table: true
      strikethrough: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']