<svg xmlns="http://www.w3.org/2000/svg" id="s2-5-meter-loading" width="960" height="276" viewBox="0 68 960 276" role="img" aria-labelledby="s2-5-meter-loading-title s2-5-meter-loading-desc">
<title id="s2-5-meter-loading-title">How a voltmeter loads a voltage divider</title>
<desc id="s2-5-meter-loading-desc">Two side-by-side voltage-divider circuits each have a 10-volt source and two 10-kilohm series resistors. At left, without a meter, the midpoint is 5 volts above ground. At right, a circle marked V represents a voltmeter with 10 kilohms of input resistance. It connects between the midpoint and ground, in parallel with the lower resistor. That pair has an equivalent resistance of 5 kilohms. The upper resistor remains 10 kilohms, so the midpoint falls to about 3.3 volts, highlighted in red. Junction dots show each parallel connection. The meter changes the circuit it measures.</desc>

