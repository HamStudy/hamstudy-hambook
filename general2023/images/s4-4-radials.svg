<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" role="img" aria-labelledby="title desc">
<title id="title">Ground-mounted and elevated radials</title><desc id="desc">Ground-mounted radial wires lie on or just under the soil. Elevated radials may slope down from the feed point. These are side views, with radial systems continuing in other directions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#111} .small{font-size:22px} .head{font-weight:bold} .wire{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .thin{fill:none;stroke:#555;stroke-width:2.5} .dash{stroke-dasharray:8 6} .arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)} .box{fill:#fff;stroke:#111;stroke-width:2.5} .light{fill:#eee;stroke:#555;stroke-width:2} </style>
<rect width="640" height="355" fill="white"/>
<text x="166" y="35" class="head" text-anchor="middle">Ground-mounted</text><text x="483" y="35" class="head" text-anchor="middle">Elevated</text><rect x="20" y="235" width="600" height="50" fill="#eee"/><line x1="20" y1="235" x2="620" y2="235" class="thin"/><line x1="165" y1="78" x2="165" y2="226" class="wire"/><line x1="45" y1="235" x2="157" y2="235" class="wire c-primary-stroke"/><line x1="173" y1="235" x2="285" y2="235" class="wire c-primary-stroke"/><line x1="165" y1="239" x2="165" y2="284" class="thin"/><line x1="482" y1="57" x2="482" y2="175" class="wire"/><line x1="477" y1="183" x2="388" y2="225" class="wire c-primary-stroke"/><line x1="487" y1="183" x2="576" y2="225" class="wire c-primary-stroke"/><line x1="482" y1="188" x2="482" y2="283" class="thin"/><text x="165" y="319" class="small" text-anchor="middle">Radials at the surface</text><text x="482" y="319" class="small" text-anchor="middle">Radials above soil</text><text x="320" y="351" class="small" text-anchor="middle">Side views; more radials extend in other directions.</text>
<style id="semantic-color">.c-primary-stroke{stroke:#0068a8}</style>

<!-- Keep the light palette for print and SVG readers without theme support. -->
<style id="figure-theme">
  @media screen and (prefers-color-scheme: dark) {
    [fill="white"] { fill: #111820; }
    [fill="#111"] { fill: #e9eef4; }
    [fill="#eee"] { fill: #24313f; }
    text { fill: #e9eef4; }
    .wire { stroke: #e9eef4; }
    .thin { stroke: #b8c5d4; }
    .arrow { stroke: #e9eef4; }
    .box { fill: #111820; stroke: #e9eef4; }
    .light { fill: #24313f; stroke: #b8c5d4; }
    .c-primary-stroke { stroke: #79c6ff; }
  }
</style>
</svg>