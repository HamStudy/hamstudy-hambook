<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img"><title>Sine-wave oscillator feedback loop</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs><g fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><rect x="70" y="55" width="200" height="80" fill="#e4f1fa"/><text x="170.0" y="103.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Amplifier</text><rect x="320" y="175" width="255" height="78" fill="#e0f2ee"/><text x="447.5" y="208.5" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Frequency-selective</text><text x="447.5" y="235.5" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">network</text><line x1="270" y1="95" x2="535" y2="95" stroke-width="2.6" marker-end="url(#arrow)" stroke="#0068a8"/><text x="503" y="72" fill="#0068a8" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Output</text><circle cx="450" cy="95" r="4" fill="#111"/><line x1="450" y1="95" x2="450" y2="175" stroke-width="2.6" marker-end="url(#arrow)" stroke="#00776f"/><line x1="320" y1="213" x2="35" y2="213" stroke-width="2.6" stroke="#00776f"/><line x1="35" y1="213" x2="35" y2="95" stroke-width="2.6" stroke="#00776f"/><line x1="35" y1="95" x2="70" y2="95" stroke-width="2.6" marker-end="url(#arrow)" stroke="#00776f"/><text x="175" y="254" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">Feedback reinforces</text><text x="175" y="280" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">the selected frequency</text></g>
