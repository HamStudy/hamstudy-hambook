<svg id="s8-5-winlink-message-path" xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="s8-5-winlink-message-path-title s8-5-winlink-message-path-desc">
<title id="s8-5-winlink-message-path-title">One internet-connected Winlink route</title>
<desc id="s8-5-winlink-message-path-desc">From left to right, a computer and radio represent your station; a radio connected to network equipment represents the gateway, also called an RMS; and an envelope on a computer screen represents the email recipient. A radio-wave symbol identifies the bidirectional radio link, which uses a compatible protocol such as VARA. A globe identifies the bidirectional internet link from the gateway to the recipient. Winlink is the messaging system, not a separate device or another name for VARA. This shows one Winlink route; radio-only routes are also possible when available.</desc>
