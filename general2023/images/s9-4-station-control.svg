<svg xmlns="http://www.w3.org/2000/svg" id="s9-4-station-control" width="1080" height="216" viewBox="0 0 1080 216" role="img" aria-labelledby="s9-4-station-control-title s9-4-station-control-desc">
<title id="s9-4-station-control-title">Local, remote, and automatic station control</title>
<desc id="s9-4-station-control-desc">Three side-by-side scenes show the same transceiver under different control methods. At left, an operator beside the radio represents local control: the operator adjusts the radio directly. In the center, an operator uses a separate control console; a dashed line connects that console to the radio: remote control. At right, a small controller box marked with a chip symbol operates the radio, with no person shown: automatic control. The distinction is how the station is controlled, not simply whether it uses a computer. All three methods still have a responsible station licensee and control operator. The diagram explains control methods, not permission for any particular transmission.</desc>
<style>
#s9-4-station-control .body { fill:#e5f0f6; stroke:#364756; stroke-width:2.4; }
#s9-4-station-control .screen { fill:#ffffff; stroke:#086c9d; stroke-width:2; }
#s9-4-station-control .ink { stroke:#364756; }
#s9-4-station-control .blue { stroke:#086c9d; }
#s9-4-station-control .person { fill:#364756; }
#s9-4-station-control .muted { stroke:#6f8190; }
#s9-4-station-control .rule { stroke:#c4d0d8; }
#s9-4-station-control path,#s9-4-station-control line,#s9-4-station-control rect { stroke-linecap:round; stroke-linejoin:round; }
@media screen and (prefers-color-scheme: dark) {
#s9-4-station-control .body { fill:#142e41; stroke:#c3d1dc; }
#s9-4-station-control .screen { fill:#08141d; stroke:#83cefa; }
#s9-4-station-control .ink { stroke:#c3d1dc; }
#s9-4-station-control .blue { stroke:#83cefa; }
#s9-4-station-control .person { fill:#c3d1dc; }
#s9-4-station-control .muted { stroke:#92a8b9; }
#s9-4-station-control .rule { stroke:#394e5e; }
#s9-4-station-control [fill="#086c9d"] { fill:#83cefa; }
}
</style>

