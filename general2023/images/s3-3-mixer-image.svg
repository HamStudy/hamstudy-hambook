<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img"><title>Wanted signal and image both produce a 9 MHz IF</title><rect width="640" height="440" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs><g fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><line x1="45" y1="155" x2="605" y2="155" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="105" y1="155" x2="105" y2="90" stroke-width="2.6" marker-end="url(#arrow)" stroke="#0068a8"/><text x="105" y="56" fill="#0068a8" stroke="none" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">Wanted</text><text x="105" y="192" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">14.230</text><line x1="320" y1="155" x2="320" y2="90" stroke-width="2.6" marker-end="url(#arrow)" stroke="#7b3fb2"/><text x="320" y="56" fill="#7b3fb2" stroke="none" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">LO</text><text x="320" y="192" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">23.230</text><line x1="535" y1="155" x2="535" y2="90" stroke-width="2.6" marker-end="url(#arrow)" stroke="#b4233b"/><text x="535" y="56" fill="#b4233b" stroke="none" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="bold">Image</text><text x="535" y="192" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">32.230</text><text x="320" y="229" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Frequency (MHz)</text><line x1="105" y1="265" x2="320" y2="265" stroke-width="2.6"/><line x1="320" y1="265" x2="535" y2="265" stroke-width="2.6"/><text x="205" y="255" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">9 MHz</text><text x="430" y="255" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">9 MHz</text><rect x="165" y="308" width="310" height="75" fill="white"/><text x="320.0" y="353.5" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Both convert to 9 MHz IF</text><text x="320" y="428" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Wanted-to-image spacing = 18 MHz = 2 × IF</text></g>
