<svg xmlns="http://www.w3.org/2000/svg" id="s5-2-solar-disturbances" width="960" height="154" viewBox="0 0 960 154" role="img" aria-labelledby="s5-2-solar-disturbances-title s5-2-solar-disturbances-desc">
<title id="s5-2-solar-disturbances-title">Solar flares and coronal mass ejections</title>
<desc id="s5-2-solar-disturbances-desc">Two side-by-side Sun-to-Earth comparisons distinguish electromagnetic radiation from a cloud of matter. On the left, a wavy arrow leads from the Sun to Earth, where an arc marks the sunlit ionosphere. Flare X-rays and ultraviolet reach Earth in about eight minutes and increase HF absorption there, especially at lower HF frequencies. That is travel time, not advance warning: a flare is seen when its light arrives. On the right, a cloud containing particles and curved magnetic-field lines travels toward Earth and its magnetic field. An Earth-directed coronal mass ejection carries this magnetized plasma. It can arrive in fifteen hours to several days and disturb Earth’s magnetic field and HF propagation. The drawings are schematic and not to scale; they do not imply that every flare produces an Earth-directed CME.</desc>

