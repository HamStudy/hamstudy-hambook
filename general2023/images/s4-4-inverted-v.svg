<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="inverted-v-title inverted-v-desc">
  <title id="inverted-v-title">An inverted V dipole</title>
  <desc id="inverted-v-desc">A single tall mast supports the center feed point. Two dipole wire legs slope down to either side with a gentle sag. End insulators separate the wires from support ropes, which keep the wire ends above ground. Coax runs from the radio up to the center feed point, where it feeds the two legs.</desc>
  <!-- Original vector drawing for HamBook. Light palette is also the print palette. -->
  <style>
    .background { fill: #fff; }
    text { font-family: Arial, Helvetica, sans-serif; font-size: 22px; fill: #111; }
    .support { fill: #e3e7eb; stroke: #737d87; stroke-width: 2; }
    .ground, .leader { fill: none; stroke: #737d87; stroke-width: 1.8; }
    .rope { fill: none; stroke: #737d87; stroke-width: 2; stroke-dasharray: 5 4; }
    .leg { fill: none; stroke: #0068a8; stroke-width: 4; stroke-linecap: round; }
    .insulator, .feed { fill: #fff; stroke: #394753; stroke-width: 2; }
    .coax { fill: none; stroke: #b45309; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .connection { fill: #0068a8; }
    .radio { fill: #edf2f5; stroke: #394753; stroke-width: 2; }
    .knob { fill: #737d87; }
    @media screen and (prefers-color-scheme: dark) {
      .background { fill: #111820; }
      text { fill: #e9eef4; }
      .support { fill: #24313f; stroke: #a4b0bd; }
      .ground, .leader, .rope { stroke: #a4b0bd; }
      .leg { stroke: #79c6ff; }
      .insulator, .feed { fill: #111820; stroke: #d1dce6; }
      .coax { stroke: #ffc078; }
      .connection { fill: #79c6ff; }
      .radio { fill: #24313f; stroke: #d1dce6; }
      .knob { fill: #d1dce6; }
    }
  </style>
  <rect class="background" width="640" height="300"/>

  <!-- The mast is behind the feed-point housing; it is a mechanical support. -->
  <path class="ground" d="M 26,279 H 614"/>
  <path class="support" d="M 316,41 H 324 V 279 H 316 Z"/>
  <text x="320" y="25" text-anchor="middle">One high support</text>

  <!-- Wires bow below their straight endpoint-to-endpoint lines. -->
  <path class="leg" d="M 308,76 Q 192,158 87,183"/>
  <path class="leg" d="M 332,76 Q 448,158 553,183"/>
  <text x="152" y="112" text-anchor="middle">Dipole leg</text>
  <text x="488" y="112" text-anchor="middle">Dipole leg</text>

  <g transform="translate(87 183) rotate(-16)">
    <rect class="insulator" x="-18" y="-4" width="18" height="8" rx="3"/>
  </g>
  <g transform="translate(553 183) rotate(16)">
    <rect class="insulator" x="0" y="-4" width="18" height="8" rx="3"/>
  </g>
  <path class="rope" d="M 69.7,188 L 38,273 M 570.3,188 L 602,273"/>
  <path class="ground" d="M 32,273 H 44 M 38,273 L 35,284 M 596,273 H 608 M 602,273 L 605,284"/>
  <path class="leader" d="M 104,218 L 83,190"/>
  <text x="113" y="225">End insulator</text>
  <path class="leader" d="M 532,221 H 551 L 577,202"/>
  <text x="531" y="218" text-anchor="end">Support rope</text>

  <!-- Coax leaves below the feed point, then bends away from the support. -->
  <path class="coax" d="M 320,89 C 320,109 340,110 342,130 L 351,229 Q 353,246 377,246 H 460"/>
  <rect class="feed" x="308" y="64" width="24" height="25" rx="4"/>
  <circle class="connection" cx="308" cy="76" r="3.5"/>
  <circle class="connection" cx="332" cy="76" r="3.5"/>
  <path class="leader" d="M 337,69 L 405,55"/>
  <text x="410" y="59">Feed point</text>
  <path class="leader" d="M 368,171 H 350"/>
  <text x="376" y="179">Coax</text>

  <rect class="radio" x="460" y="233" width="116" height="42" rx="5"/>
  <text x="473" y="262">Radio</text>
  <circle class="knob" cx="558" cy="253" r="8"/>
  <path class="ground" d="M 468,277 H 482 M 552,277 H 567"/>
</svg>
