<svg xmlns="http://www.w3.org/2000/svg" width="640" height="289" viewBox="0 66 640 289" role="img" aria-labelledby="title desc">
<title id="title">Transmit time depends on the averaging window</title><desc id="desc">A transmitter runs from minute zero to five and receives from minute five to ten. In a six-minute window starting at zero, it transmits five-sixths of the time, about 83 percent. Over ten minutes it transmits one-half the time, 50 percent.</desc>
