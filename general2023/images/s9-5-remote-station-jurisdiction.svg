<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img"><title>Radio jurisdiction follows the transmitter in these remote-operation examples</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#aaa" stroke-width="2"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif" fill="#171717"><text x="35" y="42" font-size="30" text-anchor="start" font-weight="bold"><tspan x="35" dy="0">Which station are you operating?</tspan></text><rect x="40" y="85" width="320" height="100" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="200" y="143" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="200" dy="0">Operator abroad</tspan></text><line x1="360" y1="135" x2="630" y2="135" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/><text x="495" y="112" font-size="28" text-anchor="middle" font-weight="normal" fill="#b45309"><tspan x="495" dy="0">Control link</tspan></text><rect x="640" y="85" width="320" height="100" rx="4" fill="#e4f1fa" stroke="#222" stroke-width="2"/><text x="800" y="143" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="800" dy="0">Transmitter in US</tspan></text><text x="500" y="229" font-size="28" text-anchor="middle" font-weight="bold" fill="#0068a8"><tspan x="500" dy="0">US radio rules and a US operator license</tspan></text><rect x="40" y="285" width="320" height="100" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="200" y="343" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="200" dy="0">Operator in US</tspan></text><line x1="360" y1="335" x2="630" y2="335" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/><text x="495" y="312" font-size="28" text-anchor="middle" font-weight="normal" fill="#b45309"><tspan x="495" dy="0">Control link</tspan></text><rect x="640" y="285" width="320" height="100" rx="4" fill="#e4f1fa" stroke="#222" stroke-width="2"/><text x="800" y="343" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="800" dy="0">Transmitter abroad</tspan></text><text x="500" y="429" font-size="28" text-anchor="middle" font-weight="bold" fill="#0068a8"><tspan x="500" dy="0">Only the transmitter country’s radio rules apply</tspan></text><text x="500" y="260" font-size="24" text-anchor="middle" font-weight="normal"><tspan x="500" dy="0">When abroad, also check local requirements.</tspan></text></g>
