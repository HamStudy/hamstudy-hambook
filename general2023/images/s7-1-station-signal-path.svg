<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img"><title>Transmit signal path and radio-side SWR measurement</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#aaa" stroke-width="2"/></pattern></defs><rect width="1000" height="410" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#171717"><text x="35" y="42" font-size="30" text-anchor="start" font-weight="bold"><tspan x="35" dy="0">A station tuner matches the load seen by the radio</tspan></text><rect x="40" y="80" width="165" height="70" rx="4" fill="#fff0dc" stroke="#222" stroke-width="2"/><text x="122" y="108" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="122" dy="0">DC power</tspan></text><text x="122" y="138" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="122" dy="0">source</tspan></text><line x1="122" y1="150" x2="122" y2="200" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="205" width="165" height="90" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="122.5" y="245" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="122.5" dy="0">Transceiver</tspan></text><rect x="280" y="205" width="140" height="90" rx="4" fill="#e4f1fa" stroke="#222" stroke-width="2"/><text x="350.0" y="245" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="350.0" dy="0">SWR</tspan><tspan x="350.0" dy="35.0">meter</tspan></text><rect x="490" y="205" width="145" height="90" rx="4" fill="#e4f1fa" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/><text x="562.5" y="245" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="562.5" dy="0">Station</tspan><tspan x="562.5" dy="35.0">tuner</tspan></text><rect x="705" y="205" width="100" height="90" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="755.0" y="245" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="755.0" dy="0">Feed</tspan><tspan x="755.0" dy="35.0">line</tspan></text><rect x="855" y="205" width="130" height="90" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="920.0" y="245" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="920.0" dy="0">Antenna</tspan></text><line x1="205" y1="250" x2="275" y2="250" stroke="#0068a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="420" y1="250" x2="485" y2="250" stroke="#0068a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="635" y1="250" x2="700" y2="250" stroke="#0068a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="805" y1="250" x2="850" y2="250" stroke="#0068a8" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="175" font-size="28" text-anchor="start" font-weight="normal"><tspan x="490" dy="0">Optional</tspan></text><text x="350" y="333" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="350" dy="0">This meter checks the radio-side match.</tspan></text><text x="500" y="382" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="500" dy="0">A mismatch may remain on the feed line beyond the station tuner.</tspan></text></g>
