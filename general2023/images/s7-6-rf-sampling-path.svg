<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img"><title>An attenuated sample feeds the oscilloscope while a dummy load takes transmitter power</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#aaa" stroke-width="2"/></pattern></defs><rect width="1000" height="390" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#171717"><text x="35" y="42" font-size="29" text-anchor="start" font-weight="bold"><tspan x="35" dy="0">The scope receives a sample, not the full transmitter output</tspan></text><rect x="45" y="105" width="220" height="95" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="155.0" y="147" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="155.0" dy="0">Transmitter</tspan></text><rect x="390" y="105" width="220" height="95" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="500.0" y="147" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="500.0" dy="0">Rated RF</tspan><tspan x="500.0" dy="35.0">sampler</tspan></text><rect x="735" y="105" width="220" height="95" rx="4" fill="#f4f4f4" stroke="#222" stroke-width="2"/><text x="845.0" y="147" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="845.0" dy="0">Rated</tspan><tspan x="845.0" dy="35.0">dummy load</tspan></text><line x1="265" y1="150" x2="383" y2="150" stroke="#0068a8" stroke-width="3" marker-end="url(#arrow)"/><line x1="610" y1="150" x2="728" y2="150" stroke="#0068a8" stroke-width="3" marker-end="url(#arrow)"/><text x="674" y="96" font-size="28" text-anchor="middle" font-weight="normal" fill="#0068a8"><tspan x="674" dy="0">Main RF path</tspan></text><line x1="500" y1="200" x2="500" y2="265" stroke="#00776f" stroke-width="3" marker-end="url(#arrow)"/><text x="535" y="243" font-size="28" text-anchor="start" font-weight="normal" fill="#00776f"><tspan x="535" dy="0">Attenuated sample</tspan></text><rect x="365" y="272" width="270" height="82" rx="4" fill="#e0f2ee" stroke="#222" stroke-width="2"/><text x="500" y="304" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="500" dy="0">Oscilloscope</tspan></text><text x="500" y="337" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="500" dy="0">vertical input</tspan></text></g>
