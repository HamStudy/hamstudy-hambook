<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" role="img"><title>Example receiver path with digital signal processing</title><rect width="640" height="580" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs><g fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><rect x="95" y="20" width="450" height="80" fill="#e4f1fa"/><text x="320.0" y="68.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Antenna / analog front end</text><line x1="320" y1="100" x2="320" y2="127" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="130" width="450" height="80" fill="white"/><text x="320.0" y="164.5" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">ADC</text><text x="320.0" y="191.5" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Signal values become numbers</text><line x1="320" y1="210" x2="320" y2="237" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="240" width="450" height="80" fill="#e0f2ee"/><text x="320.0" y="274.5" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">DSP</text><text x="320.0" y="301.5" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Filtering and detection</text><line x1="320" y1="320" x2="320" y2="347" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="350" width="450" height="80" fill="white"/><text x="320.0" y="398.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">DAC / audio amplifier</text><line x1="320" y1="430" x2="320" y2="457" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="460" width="450" height="80" fill="#fff0dc"/><text x="320.0" y="508.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Speaker</text></g>
