<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" width="640" height="428" role="img"><title>Example receiver path with digital signal processing</title><rect width="640" height="428" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs><g fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><rect x="95" y="16" width="450" height="52" fill="#e4f1fa"/><text x="320.0" y="50.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Antenna / analog front end</text><line x1="320" y1="68" x2="320" y2="89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="92" width="450" height="72" fill="white"/><text x="320.0" y="121.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">ADC</text><text x="320.0" y="148.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Signal values become numbers</text><line x1="320" y1="164" x2="320" y2="185" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="188" width="450" height="72" fill="#e0f2ee"/><text x="320.0" y="217.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">DSP</text><text x="320.0" y="244.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">Filtering and detection</text><line x1="320" y1="260" x2="320" y2="281" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="284" width="450" height="52" fill="white"/><text x="320.0" y="318.0" fill="#111" stroke="none" font-family="Arial, sans-serif" font-size="23" text-anchor="middle">DAC / audio amplifier</text><line x1="320" y1="336" x2="320" y2="357" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="360" width="450" height="52" fill="#fff0dc"/>