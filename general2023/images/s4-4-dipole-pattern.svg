<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Ideal dipole pattern slice</title><desc id="desc">Normalized field pattern of an ideal thin half-wave dipole in free space, in a plane containing the wire. The two lobes extend broadside to the horizontal wire. Nulls lie along its ends. No gain or angular scale is implied.</desc>
