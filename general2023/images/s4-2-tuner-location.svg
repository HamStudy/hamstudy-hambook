<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Tuner location changes the match</title><desc id="desc">A radio-side tuner matches the radio while the antenna feed line remains mismatched. A suitable feed-point tuner matches the antenna to the feed line. Values are ideal examples.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#111} .small{font-size:22px} .head{font-weight:bold} .wire{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .thin{fill:none;stroke:#555;stroke-width:2.5} .dash{stroke-dasharray:8 6} .arrow{fill:none;stroke:#111;stroke-width:3;marker-end:url(#arrow)} .box{fill:#fff;stroke:#111;stroke-width:2.5} .light{fill:#eee;stroke:#555;stroke-width:2} </style>

<text x="320" y="32" class="head" text-anchor="middle">Tuner at radio</text><rect x="15" y="65" width="110" height="65" rx="5" class="box"/><text x="70" y="105" class="" text-anchor="middle">Radio</text><rect x="165" y="65" width="115" height="65" rx="5" class="box"/><text x="222" y="105" class="" text-anchor="middle">Tuner</text><line x1="125" y1="98" x2="165" y2="98" class="wire c-passband-stroke"/><line x1="280" y1="98" x2="515" y2="98" class="wire c-secondary-stroke"/><line x1="515" y1="62" x2="515" y2="133" class="wire"/><line x1="482" y1="62" x2="548" y2="62" class="wire"/><text x="143" y="165" class="small" text-anchor="middle">1:1</text><text x="398" y="165" class="small" text-anchor="middle">Feed line: 5:1</text><text x="572" y="215" class="small" text-anchor="middle">Antenna</text><line x1="565" y1="195" x2="531" y2="127" class="thin"/><text x="320" y="215" class="head" text-anchor="middle">Tuner at antenna</text><rect x="15" y="245" width="110" height="65" rx="5" class="box"/><text x="70" y="285" class="" text-anchor="middle">Radio</text><line x1="125" y1="278" x2="390" y2="278" class="wire c-passband-stroke"/><rect x="390" y="245" width="115" height="65" rx="5" class="box"/><text x="447" y="285" class="" text-anchor="middle">Tuner</text><line x1="505" y1="278" x2="560" y2="278" class="wire"/><line x1="560" y1="243" x2="560" y2="313" class="wire"/><line x1="527" y1="243" x2="593" y2="243" class="wire"/><text x="255" y="345" class="small" text-anchor="middle">Feed line: 1:1</text><text x="320" y="390" class="small" text-anchor="middle">Ideal examples; tuner and line losses omitted.</text>
<style id="semantic-color">.c-passband-stroke{stroke:#00776f}.c-secondary-stroke{stroke:#b45309}</style>

<!-- Keep the light palette for print and SVG readers without theme support. -->
<style id="figure-theme">
  @media screen and (prefers-color-scheme: dark) {
    [fill="white"] { fill: #000000; }
    [fill="#111"] { fill: #e9eef4; }
    text { fill: #e9eef4; }
    .wire { stroke: #e9eef4; }
    .thin { stroke: #b8c5d4; }
    .arrow { stroke: #e9eef4; }
    .box { fill: #000000; stroke: #e9eef4; }
    .light { fill: #24313f; stroke: #b8c5d4; }
    .c-passband-stroke { stroke: #70d5c6; }
    .c-secondary-stroke { stroke: #ffc078; }
  }
</style>
</svg>