<svg xmlns="http://www.w3.org/2000/svg" id="s4-3-log-periodic" width="850" height="214" viewBox="80 40 850 214" role="img" aria-labelledby="s4-3-log-periodic-title s4-3-log-periodic-desc">
<title id="s4-3-log-periodic-title">Log-periodic dipole array</title>
<desc id="s4-3-log-periodic-desc">Seven dipoles become shorter and closer together by a constant ratio toward one end of the array. Longer elements serve lower frequencies; shorter elements serve higher frequencies. Every dipole connects at its center to a common two-conductor feed system. Connections alternate between adjacent dipoles, shown by crossed feed lines with gaps at the crossings to indicate that the wires do not touch. The external feed enters at the short-element end. This schematic explains the arrangement; it is not a construction plan or a radiation-pattern plot.</desc>

<style>
  #s4-3-log-periodic .ink { stroke: #526374; }
  #s4-3-log-periodic .divider { stroke: #c7d1da; stroke-width: 1.5; }
  #s4-3-log-periodic .primary { stroke: #0068a8; }
  #s4-3-log-periodic .primary-fill { fill: #0068a8; }
  #s4-3-log-periodic .primary-tint { fill: #e4f1fa; }
  #s4-3-log-periodic .secondary { stroke: #b45309; }
  #s4-3-log-periodic .secondary-fill { fill: #b45309; }
  #s4-3-log-periodic .secondary-tint { fill: #fff0dc; }
  #s4-3-log-periodic .teal { stroke: #00776f; }
  #s4-3-log-periodic .teal-fill { fill: #00776f; }
  #s4-3-log-periodic .night { fill: #526374; }
  #s4-3-log-periodic path, #s4-3-log-periodic line, #s4-3-log-periodic polyline { stroke-linecap: round; stroke-linejoin: round; }
  @media screen and (prefers-color-scheme: dark) {
    #s4-3-log-periodic .ink { stroke: #b8c5d4; }
    #s4-3-log-periodic .divider { stroke: #536476; }
    #s4-3-log-periodic .primary { stroke: #79c6ff; }
    #s4-3-log-periodic .primary-fill { fill: #79c6ff; }
    #s4-3-log-periodic .primary-tint { fill: #15344b; }
    #s4-3-log-periodic .secondary { stroke: #ffc078; }
    #s4-3-log-periodic .secondary-fill { fill: #ffc078; }
    #s4-3-log-periodic .secondary-tint { fill: #49331c; }
    #s4-3-log-periodic .teal { stroke: #70d5c6; }
    #s4-3-log-periodic .teal-fill { fill: #70d5c6; }
    #s4-3-log-periodic .night { fill: #899bb0; }
  }
</style>

