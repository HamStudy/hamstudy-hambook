<svg xmlns="http://www.w3.org/2000/svg" width="700" height="190" viewBox="0 0 700 190" role="img" aria-labelledby="title desc">
<title id="title">Required signal and remaining link margin</title>
<desc id="desc">A horizontal dBm number line shows the example with power increasing to the right. MDS at minus 103 dBm is the left tick. The required signal at minus 97 dBm is 6 dB farther right. The received signal at minus 89 dBm is another 8 dB to the right. Tick distances are proportional to the decibel differences.</desc>
<style>svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:var(--ink)}.name{font-size:21px}.mid{text-anchor:middle}.axis{stroke:var(--muted);stroke-width:2.5;fill:none}.level{stroke:var(--ink);stroke-width:2;fill:none}.signal{stroke:var(--blue);fill:none;stroke-width:3}.required{stroke:var(--orange);fill:none;stroke-width:3}.btext{fill:var(--blue)}.otext{fill:var(--orange)}.mtext{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190}}@media print{svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}}</style>
<!-- Thirty-nine drawing units per dB: 6 dB = 234 units; 8 dB = 312 units. -->
<path class="required" d="M70 66V55H304v11"/>
<path class="signal" d="M304 66V55H616v11"/>
<text x="187" y="40" class="mid otext">6 dB SNR</text><text x="460" y="40" class="mid btext">8 dB margin</text>
<path class="axis" d="M31 96H648m-12-6 12 6-12 6"/>
<path class="level" d="M70 85v22M304 85v22M616 85v22"/>
<text x="656" y="103" class="name mtext">dBm</text>
<g text-anchor="middle"><text x="70" y="137">−103</text><text x="304" y="137">−97</text><text x="616" y="137">−89</text></g>
<g text-anchor="middle" class="name"><text x="70" y="168">MDS</text><text x="304" y="168">required</text><text x="616" y="168">received</text></g>
</svg>
