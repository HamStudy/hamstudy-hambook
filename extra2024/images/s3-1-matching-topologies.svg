<svg xmlns="http://www.w3.org/2000/svg" width="732" height="220" viewBox="0 0 732 220" role="img" aria-labelledby="title desc">
<title id="title">Pi, T, and Pi-L filter networks</title>
<desc id="desc">Three schematics compare low-pass Pi, high-pass T, and Pi-L networks. Each has input at left, output at right, and grounded shunt branches. The Pi-L has one extra series inductor at its output.</desc>
