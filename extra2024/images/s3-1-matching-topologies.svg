 text{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#263445}
 .symbol{font-style:italic}.heading{font-size:32px}.extra{stroke:#b35c00}.extra-label{fill:#b35c00}
 @media(prefers-color-scheme:dark){.wire{stroke:#e6edf3}.node{fill:#e6edf3}.port{fill:#101827;stroke:#e6edf3}text{fill:#e6edf3}.extra{stroke:#f5a851}.extra-label{fill:#f5a851}}
 @media print{.wire{stroke:#263445}.node{fill:#263445}.port{fill:#fff;stroke:#263445}text{fill:#263445}.extra{stroke:#b35c00}.extra-label{fill:#b35c00}}
</style>
