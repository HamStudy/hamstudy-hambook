<svg xmlns="http://www.w3.org/2000/svg" width="760" height="234" viewBox="0 0 760 234" role="img" aria-labelledby="title">
  <title id="title">Series and parallel RLC circuits at resonance</title>
  <style>
    svg{--ink:#263445;--blue:#1672ac;--orange:#b35c00}
    .wire{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .node{fill:var(--ink)}
    text{font-family:Arial,Helvetica,sans-serif;font-size:26px;font-style:italic;fill:var(--ink)}
    .sub{font-size:17px;font-style:normal}
    .current{fill:none;stroke:var(--blue);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
    .small{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .big{fill:none;stroke:var(--orange);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
    .loop{fill:none;stroke:var(--orange);stroke-width:3;stroke-linecap:round}
    .head{fill:var(--orange)}
    .current-label{fill:var(--blue)}
    .reactive-label{fill:var(--orange)}
    @media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--blue:#64b4ed;--orange:#f5a851}}
    @media print{svg{--ink:#263445;--blue:#1672ac;--orange:#b35c00}}
  </style>

  <!-- Series: source, R, L, and C share one path and one current. -->
  <g class="wire">
    <path d="M57 100 V55 H131 M195 55 H294 V95 M294 143 V191 H174 M162 191 H57 V146"/>
    <circle cx="57" cy="123" r="23"/>
    <path d="M43 123 C48 109 52 109 57 123 S66 137 71 123"/>
    <path d="M131 55 L137 55 L142 46 L150 64 L158 46 L166 64 L174 46 L182 64 L188 55 H195"/>
    <path d="M294 95 c-15 0 -15 12 0 12 c-15 0 -15 12 0 12 c-15 0 -15 12 0 12 c-15 0 -15 12 0 12"/>
    <path d="M162 176 V206 M174 176 V206"/>
  </g>
  <text x="26" y="132" text-anchor="end">E</text>
  <text x="163" y="33" text-anchor="middle">R</text>
  <text x="315" y="126">L</text>
  <text x="168" y="228" text-anchor="middle">C</text>
  <g class="current">
    <path d="M212 55 H240 M233 50 L240 55 L233 60"/>
    <path d="M294 153 V181 M289 174 L294 181 L299 174"/>
    <path d="M230 191 H202 M209 186 L202 191 L209 196"/>
  </g>
  <text class="current-label" x="226" y="35" text-anchor="middle">I</text>
  <text class="current-label" x="314" y="173">I</text>
  <text class="current-label" x="216" y="219" text-anchor="middle">I</text>

  <!-- Parallel: R, L, and C share the same two source nodes. -->
  <g class="wire">
    <path d="M406 100 V55 H712 V125 M712 137 V191 H406 V146"/>
    <circle cx="406" cy="123" r="23"/>
    <path d="M392 123 C397 109 401 109 406 123 S415 137 420 123"/>
    <path d="M502 55 V109 L494 115 L510 123 L494 131 L510 139 L494 147 L502 153 V191"/>
    <path d="M592 55 V107 c-15 0 -15 12 0 12 c-15 0 -15 12 0 12 c-15 0 -15 12 0 12 c-15 0 -15 12 0 12 V191"/>
    <path d="M697 125 H727 M697 137 H727"/>
  </g>
  <g class="node">
    <circle cx="502" cy="55" r="3"/><circle cx="502" cy="191" r="3"/>
    <circle cx="592" cy="55" r="3"/><circle cx="592" cy="191" r="3"/>
  </g>
  <text x="376" y="132" text-anchor="end">E</text>
  <text x="523" y="140">R</text>
  <text x="613" y="140">L</text>
  <text x="733" y="140">C</text>

  <!-- Small input and resistor currents. -->
  <g class="small">
    <path d="M439 55 H455 M450 51 L455 55 L450 59"/>
    <path d="M502 75 V91 M498 86 L502 91 L506 86"/>
  </g>
  <text class="current-label" x="447" y="35" text-anchor="middle">I<tspan dy="5" class="sub">in</tspan></text>
  <text class="current-label" x="519" y="89">I<tspan dy="5" class="sub">R</tspan></text>

  <!-- Large branch currents in L and C, circulating around the L-C loop. -->
  <g class="big">
    <path d="M592 102 V66 M584 75 L592 66 L600 75"/>
    <path d="M712 66 V102 M704 93 L712 102 L720 93"/>
  </g>
  <path class="loop" d="M655.55 164.25 A20 40 0 1 1 679.32 153.71"/>
  <polygon class="head" points="675.45,162.93 684.39,155.84 674.25,151.58"/>
  <text class="reactive-label" x="580" y="89" text-anchor="end">I<tspan dy="5" class="sub">L</tspan></text>
  <text class="reactive-label" x="729" y="89">I<tspan dy="5" class="sub">C</tspan></text>
</svg>
