<svg xmlns="http://www.w3.org/2000/svg" id="s11-4-remote-link" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="s11-4-remote-link-title s11-4-remote-link-desc">
<title id="s11-4-remote-link-title">Two kinds of control link to a remote station</title><desc id="s11-4-remote-link-desc">A control point at left connects to a remote station at right by either of two links. The upper link, through the internet, a phone line, or fiber, counts as wireline. The lower link is a radio path between two antennas and must use an auxiliary station. The remote station holds the transmitter, a 3-minute failsafe timer, and a posted license copy and contact label.</desc>
<style>#s11-4-remote-link{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}
@media(prefers-color-scheme:dark){#s11-4-remote-link{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190}}
@media print{#s11-4-remote-link{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}}
#s11-4-remote-link text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:var(--ink)}
#s11-4-remote-link .muted{fill:var(--muted)}
#s11-4-remote-link .small{font-size:16px}
#s11-4-remote-link .bluet{fill:var(--blue);font-weight:bold}
#s11-4-remote-link .oranget{fill:var(--orange);font-weight:bold}
#s11-4-remote-link .box{fill:none;stroke:var(--ink);stroke-width:2}
#s11-4-remote-link .inner{fill:none;stroke:var(--muted);stroke-width:1.6}
#s11-4-remote-link .wire{fill:none;stroke:var(--blue);stroke-width:4}
#s11-4-remote-link .ant{fill:none;stroke:var(--orange);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
#s11-4-remote-link .wave{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-dasharray:8 6}
</style>

<!-- Control point -->
<rect class="box" x="20" y="55" width="160" height="140" rx="8"/>
<text x="100" y="118" text-anchor="middle">Control</text>
<text x="100" y="141" text-anchor="middle">point</text>

<!-- Remote station -->
<rect class="box" x="520" y="20" width="180" height="215" rx="8"/>
<text x="610" y="46" text-anchor="middle">Remote station</text>
<rect class="inner" x="538" y="60" width="144" height="40" rx="4"/>
<text x="610" y="86" text-anchor="middle" class="small">Transmitter</text>
<circle cx="556" cy="128" r="12" fill="none" stroke="var(--ink)" stroke-width="2"/>
<path d="M556 128V120M556 128L562 131" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="576" y="134" class="small">3-min stop</text>
<rect class="inner" x="538" y="156" width="144" height="62" rx="4" stroke-dasharray="4 3"/>
<text x="610" y="181" text-anchor="middle" class="small">License copy</text>
<text x="610" y="204" text-anchor="middle" class="small">Contact label</text>

<!-- Wireline path -->
<path class="wire" d="M180 92H520"/>
<text x="350" y="78" text-anchor="middle" class="muted">Internet, phone, or fiber</text>
<text x="350" y="118" text-anchor="middle" class="bluet">Wireline</text>

<!-- Radio path -->
<path class="ant" d="M180 176H206V146M196 136L206 146L216 136"/>
<path class="ant" d="M520 176H494V146M484 136L494 146L504 136"/>
<path class="wave" d="M226 146Q244 132 262 146T298 146T334 146T370 146T406 146T442 146T478 146"/>
<text x="350" y="186" text-anchor="middle" class="muted">Radio link</text>
<text x="350" y="210" text-anchor="middle" class="oranget">Auxiliary station</text>
</svg>
