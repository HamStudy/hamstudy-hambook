<svg xmlns="http://www.w3.org/2000/svg" width="736" height="235" viewBox="0 0 736 235" role="img" aria-labelledby="title"><title id="title">A phase-locked frequency synthesizer</title><style>svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42} text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:var(--ink)} .axis{stroke:var(--ink);stroke-width:1.6;fill:none}.guide{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 5;fill:none}.blue{stroke:var(--blue);fill:none;stroke-width:3.4}.orange{stroke:var(--orange);fill:none;stroke-width:3.4;stroke-dasharray:9 5}.muted{fill:var(--muted)}.small{font-size:16px}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190}}@media print{svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="var(--ink)" stroke-width="1.6"/></marker></defs><rect x="20" y="57" width="103" height="52" rx="3" class="axis"/><text x="71.5" y="89.0" text-anchor="middle">Reference</text><rect x="197" y="57" width="115" height="52" rx="3" class="axis"/><text x="254.5" y="78.0" text-anchor="middle">Phase</text><text x="254.5" y="100" text-anchor="middle">detector</text><rect x="375" y="57" width="76" height="52" rx="3" class="axis"/><text x="413.0" y="89.0" text-anchor="middle">LPF</text><rect x="512" y="57" width="76" height="52" rx="3" class="axis"/><text x="550.0" y="89.0" text-anchor="middle">VCO</text><rect x="466" y="171" width="94" height="48" rx="3" class="axis"/><text x="513.0" y="201.0" text-anchor="middle">÷100</text><line x1="123" y1="83" x2="195" y2="83" class="axis" marker-end="url(#arrow)"/><line x1="312" y1="83" x2="373" y2="83" class="axis" marker-end="url(#arrow)"/><line x1="451" y1="83" x2="510" y2="83" class="axis" marker-end="url(#arrow)"/><line x1="588" y1="83" x2="714" y2="83" class="axis" marker-end="url(#arrow)"/><line x1="654" y1="83" x2="654" y2="195" class="axis" /><line x1="654" y1="195" x2="562" y2="195" class="axis" marker-end="url(#arrow)"/><line x1="466" y1="195" x2="254.5" y2="195" class="axis" /><line x1="254.5" y1="195" x2="254.5" y2="111" class="axis" marker-end="url(#arrow)"/><circle cx="654" cy="83" r="4" fill="var(--ink)"/><text x="159" y="44" text-anchor="middle">1 MHz</text><text x="665" y="44" text-anchor="middle">100 MHz</text><text x="356" y="181" text-anchor="middle">1 MHz</text><text x="481" y="44" text-anchor="middle" font-style="italic">V</text></svg>