<svg xmlns="http://www.w3.org/2000/svg" width="620" height="345" viewBox="0 0 620 345" role="img" aria-labelledby="title"><title id="title">The auroral oval around the north magnetic pole, quiet and disturbed</title><style>svg{--ink:#263445;--muted:#586777;--grid:#c9d0d8;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42;--sea:#eef3f7}text{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:var(--ink)}.small{font-size:17px}.disk{fill:var(--sea);stroke:var(--muted);stroke-width:1.6}.lat{fill:none;stroke:var(--grid);stroke-width:1.2;stroke-dasharray:4 5}.quiet{fill:none;stroke:var(--green);stroke-width:9;stroke-opacity:.9}.dist{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:1.4;stroke-dasharray:6 4;fill-rule:evenodd}.pth1{stroke:var(--red);stroke-width:3;fill:none}.pth2{stroke:var(--blue);stroke-width:3;fill:none}.lead{stroke:var(--muted);stroke-width:1.2;fill:none}.stn{fill:var(--ink)}.pole{fill:var(--ink)}.gtext{fill:var(--green)}.rtext{fill:var(--red)}.btext{fill:var(--blue)}.mtext{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--grid:#536172;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190;--sea:#232b35}}@media print{svg{--ink:#263445;--muted:#586777;--grid:#c9d0d8;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42;--sea:#eef3f7}}</style><circle cx="170" cy="165" r="150" class="disk"/><circle cx="170" cy="165" r="105" class="lat"/><path d="M228.3 149.3A64 64 0 1 0 100.3 149.3A64 64 0 1 0 228.3 149.3ZM194.3 149.3A30 30 0 1 0 134.3 149.3A30 30 0 1 0 194.3 149.3Z" class="dist"/><circle cx="164.3" cy="149.3" r="38" class="quiet"/><circle cx="164.3" cy="149.3" r="4.5" class="pole"/><path d="M247.9 210.0L92.1 120.0" class="pth1"/><path d="M84.0 225.2L91.4 228.8L99.0 232.1L106.7 234.9L114.4 237.5L122.2 239.6L130.1 241.5L138.0 243.0L146.0 244.1L154.0 244.9L162.0 245.4L170.0 245.6L178.0 245.4L186.0 244.9L194.0 244.1L202.0 243.0L209.9 241.5L217.8 239.6L225.6 237.5L233.3 234