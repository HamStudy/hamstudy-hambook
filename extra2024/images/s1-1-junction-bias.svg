<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-labelledby="title desc">
<title id="title">Bias changes a PN junction's depletion width</title>
<desc id="desc">Two continuous semiconductor bars compare forward and reverse bias. P is on the left and N on the right in each. Forward bias has positive P contact, negative N contact, majority-carrier arrows toward the junction, and a narrow depletion band. Reverse bias reverses the contacts and pushes majority carriers away from a wider depletion band. The band is semiconductor, not a physical gap. W marks its width.</desc>
<style>
 text{font-family:Arial,Helvetica,sans-serif;font-size:30px;fill:#263445}.polarity{font-size:34px}.width-label{font-style:italic;font-size:28px}
 .outline,.lead{fill:none;stroke:#263445;stroke-width:2.5;stroke-linejoin:round}.p-region{fill:#fff1df}.n-region{fill:#e6f2fa}.depletion{fill:#d5dce3}.hatch{stroke:#7c8b99;stroke-width:1;opacity:.5}
 .junction{stroke:#647486;stroke-width:1.5;stroke-dasharray:4 4}.width{fill:none;stroke:#647486;stroke-width:2}
 .hole{fill:#fff;stroke:#b35c00;stroke-width:2.3}.electron{fill:#1672ac;stroke:#1672ac;stroke-width:2.3}.charge-hole{stroke:#b35c00;stroke-width:2}.charge-electron{stroke:#fff;stroke-width:2}
 .hole-motion{fill:none;stroke:#b35c00;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.electron-motion{fill:none;stroke:#1672ac;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 @media(prefers-color-scheme:dark){text{fill:#e6edf3}.outline,.lead{stroke:#e6edf3}.p-region{fill:#302719}.n-region{fill:#173044}.depletion{fill:#435163}.hatch{stroke:#b1bdc9}.junction,.width{stroke:#b3c0ce}.hole{fill:#302719;stroke:#f5a851}.electron{fill:#64b4ed;stroke:#64b4ed}.charge-hole{stroke:#f5a851}.charge-electron{stroke:#101827}.hole-motion{stroke:#f5a851}.electron-motion{stroke:#64b4ed}}
 @media print{text{fill:#263445}.outline,.lead{stroke:#263445}.p-region{fill:#fff1df}.n-region{fill:#e6f2fa}.depletion{fill:#d5dce3}.hatch{stroke:#7c8b99}.junction,.width{stroke:#647486}.hole{fill:#fff;stroke:#b35c00}.electron{fill:#1672ac;stroke:#1672ac}.charge-hole{stroke:#b35c00}.charge-electron{stroke:#fff}.hole-motion{stroke:#b35c00}.electron-motion{stroke:#1672ac}}
</style>
<defs><pattern id="hatching" width="8" height="8" patternUnits="userSpaceOnUse"><path class="hatch" d="M-2 2L2 -2 M0 8L8 0 M6 10L10 6"/></pattern></defs>
