<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Standing-wave magnitudes along shorted and open lines</title><desc id="desc">Two graphs show normalized voltage and current magnitudes against distance from the load. The shorted line is at left and the open line at right. Voltage and current exchange nodes and maxima every quarter wavelength. Each graph is aligned with a line schematic: load at left, half-wave input at right.</desc>
