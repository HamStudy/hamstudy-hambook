<svg xmlns="http://www.w3.org/2000/svg" width="730" height="440" viewBox="0 0 730 440" role="img" aria-labelledby="title"><title id="title">Tying off to a lattice tower leg above head level</title><style>svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:var(--ink)}.small{font-size:16px}.mid{text-anchor:middle}.end{text-anchor:end}.leg{stroke:var(--ink);stroke-width:6;fill:none}.rung{stroke:var(--ink);stroke-width:3;fill:none}.brace{stroke:var(--muted);stroke-width:2.5;fill:none;stroke-linejoin:round}.guy{stroke:var(--muted);stroke-width:2;fill:none}.lead{stroke:var(--muted);stroke-width:1.2;fill:none}.body{stroke:var(--blue);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.head{fill:var(--blue)}.ghost{stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round}.ghosthead{fill:none;stroke:var(--muted);stroke-width:3}.lan{stroke:var(--orange);stroke-width:3.5;fill:none;stroke-linecap:round}.lan2{stroke:var(--orange);stroke-width:3;fill:none;stroke-dasharray:8 5;stroke-linecap:round}.hook{fill:none;stroke:var(--orange);stroke-width:3}.dring{fill:var(--orange)}.fall{stroke:var(--red);stroke-width:3;fill:none}.otext{fill:var(--orange)}.rtext{fill:var(--red)}.mtext{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190}}@media print{svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}}</style><defs><marker id="oarrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--orange)" stroke-width="2"/></marker><marker id="rarrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L8,5 L1,9" fill="none" stroke="var(--red)" stroke-width="2"/></marker></defs>
