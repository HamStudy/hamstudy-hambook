<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title"><title id="title">Spectrum of an analog fast-scan TV channel with vestigial sideband</title><style>svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42} text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:var(--ink)} .axis{stroke:var(--ink);stroke-width:1.6;fill:none}.grid{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 5;fill:none;opacity:.7}.blue{stroke:var(--blue);fill:none;stroke-width:3.4}.orange{stroke:var(--orange);fill:none;stroke-width:3.4;stroke-dasharray:10 6}.green{stroke:var(--green);fill:none;stroke-width:3.6;stroke-dasharray:2 6;stroke-linecap:round}.red{stroke:var(--red);fill:none;stroke-width:3.4}.muted{fill:var(--muted)}.small{font-size:16px}.tb{fill:var(--blue)}.to{fill:var(--orange)}.tg{fill:var(--green)}.tr{fill:var(--red)}.fblue{fill:var(--blue)}.forange{fill:var(--orange)}.fgreen{fill:var(--green)}.fmuted{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190}}@media print{svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L7,4 L1,7" fill="none" stroke="var(--ink)" stroke-width="1.6"/></marker></defs><line x1="50" y1="210" x2="724" y2="210" class="axis" marker-end="url(#arrow)"/><text x="728" y="216" font-style="italic" class="small">f</text><polygon points="60.0,210.0 113.3,117.0 193.3,117.0 641.3,117.0 657.3,210.0" class="fblue" fill-opacity="0.22" stroke="var(--blue)" stroke-width="2.4"/><polygon points="60.0,210.0 113.3,117.0 193.3,117.0 193.3,210.0" class="fblue" fill-opacity="0.45" stroke="none"/><line x1="193.3" y1="210" x2="193.3" y2="60.0" class="blue" style="stroke-width:4"/><text x="193.3" y="50.0" text-anchor="middle" class="tb small">Video carrier</text><line x1="575.2" y1="117.0" x2="575.2" y2="82.5" class="green" style="stroke-dasharray:none;stroke-width:4"/><text x="575.2" y="72.5" text-anchor="middle" class="tg small">Color</text><line x1="673.3" y1="210" x2="673.3" y2="105.0" class="orange" style="stroke-dasharray:none;stroke-width:4"/><text x="681.3" y="95.0" text-anchor="middle" class="to small">Sound</text><path d="M113.3,234 L113.3,240 L193.3,240 L193.3,234" class="axis" style="stroke-width:1.4"/><text x="153.3" y="260" text-anchor="middle" class="small">0.75 MHz</text><text x="153.3" y="278" text-anchor="middle" class="small muted">vestige</text><path d="M193.3,234 L193.3,240 L641.3,240 L641.3,234" class="axis" style="stroke-width:1.4"/><text x="417.3" y="260" text-anchor="middle" class="small">4.2 MHz</text><text x="417.3" y="278" text-anchor="middle" class="small muted">full upper sideband</text><path d="M60.0,294 L60.0,300 L700.0,300 L700.0,294" class="axis" style="stroke-width:1.4"/><text x="380.0" y="320" text-anchor="middle" class="small">6 MHz channel</text><line x1="60.0" y1="210" x2="60.0" y2="218" class="axis"/><line x1="700.0" y1="210" x2="700.0" y2="218" class="axis"/></svg>