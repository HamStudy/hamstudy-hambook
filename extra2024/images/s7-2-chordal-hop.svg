<svg xmlns="http://www.w3.org/2000/svg" width="730" height="300" viewBox="0 0 730 300" role="img" aria-labelledby="title"><title id="title">Ordinary multi-hop compared with a chordal hop</title><style>svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42;--soil:#8a7a63}text{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:var(--ink)}.mid{text-anchor:middle}.small{font-size:17px}.gnd{stroke:var(--soil);stroke-width:3;fill:none}.dreg{fill:var(--orange);fill-opacity:.22;stroke:none}.freg{fill:var(--blue);fill-opacity:.16;stroke:none}.ray{stroke:var(--blue);stroke-width:2.6;fill:none;stroke-linejoin:round}.pass{fill:var(--red)}.bounce{fill:none;stroke:var(--ink);stroke-width:2}.mtext{fill:var(--muted)}.rtext{fill:var(--red)}.otext{fill:var(--orange)}.btext{fill:var(--blue)}.ant{fill:var(--ink)}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190;--soil:#b9a68a}}@media print{svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42;--soil:#8a7a63}}</style><path d="M49.2 87.4A428 428 0 0 1 350.8 87.4L340.2 115.5A398 398 0 0 0 59.8 115.5Z" class="freg"/><path d="M41.8 198.4A330 330 0 0 1 358.2 198.4L351.5 210.7A316 316 0 0 0 48.5 210.7Z" class="dreg"/><path d="M50.9 227.7A300 300 0 0 1 349.1 227.7" class="gnd"/><path d="M66.8 219.2L109.3 100.5L200.0 188.0L290.7 100.5L333.2 219.2" class="ray"/><circle cx="77.6" cy="189.1" r="5" class="pass"/><circle cx="177.0" cy="165.8" r="5" class="pass"/><circle cx="223.0" cy="165.8" r="5" class="pass"/><circle cx="322.4" cy="189.1" r="5" class="pass"/><circle cx="66.8" cy="219.2" r="5" class="ant"/><circle cx="333.2" cy="219.2" r="5" class="ant"/><circle cx="200.0" cy="188.0" r="8" class="bounce"/><text x="200.0" y="220.0" class="small mid">ground reflection</text><text x="200" y="28" class="mid">multi-hop</text><text x="200" y="288" class="small mid rtext">4 passes throug