<svg xmlns="http://www.w3.org/2000/svg" width="730" height="410" viewBox="0 0 730 410" role="img" aria-labelledby="title"><title id="title">FCC RF exposure limits are lowest from 30 to 300 MHz</title>
<style>svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}text{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:var(--ink)}.mid{text-anchor:middle}.end{text-anchor:end}.tiny{font-size:14px}.axis{stroke:var(--ink);stroke-width:1.6;fill:none}.grid{stroke:var(--muted);stroke-width:1;stroke-opacity:.35;fill:none}.band{fill:var(--blue);fill-opacity:.12}.unc{stroke:var(--blue);stroke-width:3;fill:none;stroke-linejoin:round}.con{stroke:var(--orange);stroke-width:3;fill:none;stroke-dasharray:9 5;stroke-linejoin:round}.tick{stroke:var(--muted);stroke-width:1.5}.mtext{fill:var(--muted)}.bracket{stroke:var(--ink);stroke-width:1.6;fill:none}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190}}@media print{svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42}}</style>
