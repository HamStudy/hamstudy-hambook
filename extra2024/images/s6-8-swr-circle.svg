.s68swrcircle .small{font-size:19px}.s68swrcircle .sub{font-size:16px}
.s68swrcircle .grid{fill:none;stroke:#a4adb7;stroke-width:1.5}
.s68swrcircle .guide{fill:none;stroke:#778492;stroke-width:1.5;stroke-dasharray:4 5}
.s68swrcircle .heavy{fill:none;stroke:#1672ac;stroke-width:3.5}
.s68swrcircle .dot{fill:#1672ac}.s68swrcircle .center{fill:#586777}
.s68swrcircle .arrow{fill:none;stroke:#b35c00;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-color-scheme:dark){
.s68swrcircle text{fill:#e6edf3;stroke:#17212d}.s68swrcircle .grid{stroke:#697888}.s68swrcircle .guide{stroke:#96a8bb}
.s68swrcircle .heavy{stroke:#64b4ed}.s68swrcircle .dot{fill:#64b4ed}.s68swrcircle .center{fill:#a2b5c9}.s68swrcircle .arrow{stroke:#f5a851}}
