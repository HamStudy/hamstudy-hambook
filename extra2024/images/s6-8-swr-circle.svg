<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" class="s68swrcircle" role="img" aria-labelledby="s68-title s68-desc">
<title id="s68-title">A constant-SWR circle on a Smith grid</title>
<desc id="s68-desc">A heavy 2-to-1 SWR circle crosses faint resistance circles and reactance arcs. With a 50-ohm reference, its right-axis crossing is normalized resistance 2, or 100 ohms, and the left crossing is 0.5, or 25 ohms. A clockwise arrow and radial guides align the path with rim marks at zero, one-eighth, and one-quarter wavelength of travel toward the generator from the 100-ohm load.</desc>
