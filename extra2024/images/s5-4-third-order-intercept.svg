.ink{stroke:var(--ink)}.blue{stroke:var(--blue)}.orange{stroke:var(--orange)}.grid{stroke:var(--grid)}.muted{stroke:var(--muted)}
.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.wire.grid{stroke-width:1.25}.wire.muted{stroke-width:1.75}.curve{fill:none;stroke-width:4;stroke-linejoin:round}.guide{fill:none;stroke:var(--grid);stroke-width:1.8;stroke-dasharray:4 6}
