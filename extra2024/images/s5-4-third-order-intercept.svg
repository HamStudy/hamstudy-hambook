<title id="title">Theoretical third-order intercept</title><desc id="desc">Output power per tone in dBm is plotted against input power per test tone in dBm. The fundamental low-level trend rises one dB per input dB, while a third-order product rises three dB. Dashed extensions meet at input 40 dBm, output 30 dBm. The solid fundamental curve compresses below the theoretical meeting point.</desc>
