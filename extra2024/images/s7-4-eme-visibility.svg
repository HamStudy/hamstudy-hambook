<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" role="img" aria-labelledby="title"><title id="title">Two EME stations at opposite edges of the half of Earth that can see the Moon</title><style>svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42;--sea:#eef3f7}text{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:var(--ink)}.mid{text-anchor:middle}.end{text-anchor:end}.small{font-size:17px}.earth{fill:var(--sea);stroke:var(--muted);stroke-width:1.8}.vis{fill:var(--blue);fill-opacity:.2;stroke:none}.div{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 5;fill:none}.arc{stroke:var(--orange);stroke-width:5;fill:none;stroke-linecap:round}.ray{stroke:var(--ink);stroke-width:2;fill:none}.stn{fill:var(--ink)}.btext{fill:var(--blue)}.otext{fill:var(--orange)}.mtext{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#a2b5c9;--blue:#64b4ed;--orange:#f5a851;--green:#70c4ad;--red:#ff8190;--sea:#232b35}}@media print{svg{--ink:#263445;--muted:#586777;--blue:#1672ac;--orange:#b35c00;--green:#267c67;--red:#be2d42;--sea:#eef3f7}}</style><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L10,6 L1,11" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><circle cx="200" cy="155" r="118" class="earth"/><path d="M200 37A118 118 0 0 1 200 273Z" class="vis"/><path d="M200 37V273" class="div"/><path d="M200 37A118 118 0 0 1 200 273" class="arc"/><path d="M200 37H596" class="ray" marker-end="url(#ah)"/><circle cx="200" cy="37" r="6" class="stn"/><path d="M200 273H596" class="ray" marker-end="url(#ah)"/><circle cx="200" cy="273" r="6" class="stn"/><text x="188" y="29" class="end">A</text><text x="188" y="297" class="end">B</text><text x="596" y="27" class="small end">to the Moon</text><text x="596" y="297" class="small end">to the Moon</text><text x="332" y="161" class="small otext">about 12,000 mi</text><text x="250" y="151" class="small mid btext">Moon</text><text x="250" y="171" class="small mid btext">visible</text><text x="145" y="151" class="small mid mtext">Moon</text><text x="145" y="171" class="small mid mtext">not visible</text></svg>